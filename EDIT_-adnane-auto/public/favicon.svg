<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Subtle Rim Light -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#red-grad)" stroke-width="1" opacity="0.3"/>

  <!-- Dynamic 'A' Monogram + Car Silhouette -->
  <g transform="translate(0, 1)">
    <!-- Rear Wing / Arch -->
    <path d="M 12 40 C 18 30, 26 24, 32 16 C 38 24, 46 30, 52 40" fill="none" stroke="url(#silver-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Speed Line / Hood Curve -->
    <path d="M 16 38 Q 32 32 48 38" fill="none" stroke="url(#red-grad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Central A Crossbar / Grille accent -->
    <path d="M 23 32 L 41 32" fill="none" stroke="url(#silver-grad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Red Racing Accent Blade -->
    <path d="M 32 14 L 32 26" fill="none" stroke="url(#red-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Ground Shadow / Wheel accent points -->
    <circle cx="18" cy="42" r="2.5" fill="#FF3366"/>
    <circle cx="46" cy="42" r="2.5" fill="#FF3366"/>
  </g>
</svg>
